<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Our Money Tracker</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="dashboard">

        <header class="top-bar">

            <div>
                <h1>💰 Our Money</h1>
                <p>Priyanka & Vishnu</p>
            </div>

            <button id="logoutButton">
                Logout
            </button>

        </header>


        <section class="summary">

            <div class="card">
                <h3>Total Income</h3>
                <p id="totalIncome">₹0</p>
            </div>


            <div class="card">
                <h3>Total Expenses</h3>
                <p id="totalExpenses">₹0</p>
            </div>


            <div class="card">
                <h3>Available Balance</h3>
                <p id="balance">₹0</p>
            </div>


            <div class="card">
                <h3>Savings Account</h3>
                <p id="savings">₹0</p>
            </div>

        </section>


        <section class="form-card">

            <h2>Add Transaction</h2>


            <form id="transactionForm">

                <label for="type">
                    Type
                </label>


                <select id="type" required>

                    <option value="expense">
                        Expense
                    </option>

                    <option value="income">
                        Income
                    </option>

                    <option value="savings">
                        Savings
                    </option>

                </select>


                <label for="amount">
                    Amount
                </label>


                <input
                    type="number"
                    id="amount"
                    placeholder="₹ Amount"
                    min="1"
                    step="0.01"
                    required
                >


                <label for="category">
                    Category
                </label>


                <select id="category" required>

                    <option value="Salary">
                        Salary
                    </option>

                    <option value="Food">
                        Food
                    </option>

                    <option value="Travel">
                        Travel
                    </option>

                    <option value="Rent / PG">
                        Rent / PG
                    </option>

                    <option value="Shopping">
                        Shopping
                    </option>

                    <option value="Bills">
                        Bills
                    </option>

                    <option value="Entertainment">
                        Entertainment
                    </option>

                    <option value="Family">
                        Family
                    </option>

                    <option value="Medical">
                        Medical
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>


                <label for="description">
                    Description
                </label>


                <input
                    type="text"
                    id="description"
                    placeholder="What was this for?"
                >


                <label for="date">
                    Date
                </label>


                <input
                    type="date"
                    id="date"
                    required
                >


                <label for="payment_method">
                    Payment Method
                </label>


                <select id="payment_method">

                    <option value="UPI">
                        UPI
                    </option>

                    <option value="Cash">
                        Cash
                    </option>

                    <option value="Debit Card">
                        Debit Card
                    </option>

                    <option value="Credit Card">
                        Credit Card
                    </option>

                    <option value="Bank Transfer">
                        Bank Transfer
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>


                <button type="submit">
                    Add Transaction
                </button>

            </form>


            <p id="transactionMessage"></p>

        </section>


        <section class="transactions">

            <h2>Recent Transactions</h2>


            <div id="transactionList">

                <p>
                    Loading transactions...
                </p>

            </div>

        </section>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="./app.js"></script>

</body>

</html>
