<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Money Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>💰 Money Tracker</h1>

        <p class="subtitle">
            Track your income and expenses
        </p>


        <div class="form-card">

            <h2>Add Transaction</h2>

            <form id="transactionForm">

                <label>Type</label>

                <select id="type" required>

                    <option value="">
                        Select type
                    </option>

                    <option value="income">
                        Income
                    </option>

                    <option value="expense">
                        Expense
                    </option>

                </select>


                <label>Amount</label>

                <input
                    type="number"
                    id="amount"
                    placeholder="Enter amount"
                    step="0.01"
                    required
                >


                <label>Category</label>

                <select id="category" required>

                    <option value="">
                        Select category
                    </option>

                    <option value="Salary">
                        Salary
                    </option>

                    <option value="Food">
                        Food
                    </option>

                    <option value="Rent / PG">
                        Rent / PG
                    </option>

                    <option value="Travel">
                        Travel
                    </option>

                    <option value="Shopping">
                        Shopping
                    </option>

                    <option value="Bills">
                        Bills
                    </option>

                    <option value="Entertainment">
                        Entertainment
                    </option>

                    <option value="Family">
                        Family
                    </option>

                    <option value="Medical">
                        Medical
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>


                <label>Description</label>

                <input
                    type="text"
                    id="description"
                    placeholder="Example: September salary"
                >


                <label>Date</label>

                <input
                    type="date"
                    id="date"
                    required
                >


                <label>Payment Method</label>

                <select id="payment_method">

                    <option value="">
                        Select payment method
                    </option>

                    <option value="UPI">
                        UPI
                    </option>

                    <option value="Cash">
                        Cash
                    </option>

                    <option value="Debit Card">
                        Debit Card
                    </option>

                    <option value="Credit Card">
                        Credit Card
                    </option>

                    <option value="Bank Transfer">
                        Bank Transfer
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>


                <button type="submit">
                    Add Transaction
                </button>

            </form>

            <p id="message"></p>

        </div>


        <div class="transactions-card">

            <h2>Transactions</h2>

            <div id="transactionsList">

                <p>
                    No transactions yet.
                </p>

            </div>

        </div>

    </div>


    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Our JavaScript -->

    <script src="app.js"></script>

</body>

</html>
